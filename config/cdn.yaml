    - name: ratelimit-error-burst-per-ip
      when:
        reqProperty: tier
        in: [author, publish]
      rateLimit:
        limit: 10
        window: 60
        penalty: 1800
        count: errors
        groupBy:
        - reqProperty: clientIp
      action:
        type: log
        alert: true
    - name: ratelimit-login-endpoints
      when:
        reqProperty: path
        matches: '(?i)(j_security_check|/libs/granite/core/content/login|/system/sling/login|/login\.html)'
      rateLimit:
        limit: 10
        window: 60
        penalty: 900
        groupBy:
        - reqProperty: clientIp
      action: block
    - name: limit-origin-requests-client-ip
      when:
        reqProperty: tier
        equals: publish
      rateLimit:
        limit: 100
        window: 10
        penalty: 300
        count: fetches
        groupBy:
        - reqProperty: clientIp
      action: log
    - name: limit-requests-client-ip
      when:
        reqProperty: tier
        equals: publish
      rateLimit:
        limit: 500
        window: 10
        penalty: 300
        groupBy:
        - reqProperty: clientIp
      action:
        type: log
        alert: true
    - name: ofac-countries
      when:
        allOf:
        - reqProperty: tier
          in: [author, publish]
        - reqProperty: clientCountry
          in: [SY, BY, MM, KP, IQ, CD, SD, IR, LR, ZW, CU, CI]
      action: block
  responseTransformations:
    rules:
    - name: set-content-usage-header
      when:
        reqProperty: tier
        equals: publish
      actions:
      - type: set
        respHeader: Content-Usage
        value: train-ai=n
